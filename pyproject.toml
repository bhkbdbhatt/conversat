[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversat"
version = "0.1.0"
description = "Conversational testing platform: describe chatbot conversations in YAML, assert on real bot replies across HTTP, WebSocket and browser connectors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "conversat contributors" }]
keywords = ["chatbot", "testing", "conversation", "llm", "e2e", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=12",
  "playwright>=1.44",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/conversat-dev/conversat"
Issues = "https://github.com/conversat-dev/conversat/issues"

[project.scripts]
conversat = "conversat.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conversat"]

[tool.hatch.build.targets.sdist]
include = ["src/conversat", "tests", "examples", "README.md", "Makefile"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: tests that spawn servers or browsers",
  "browser: tests that require playwright browsers",
]
filterwarnings = ["error::DeprecationWarning:conversat.*"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
extend-exclude = [".venv", "build", "dist", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # line length handled by the formatter
  "B008",   # typer/fastapi call defaults are idiomatic
  "RUF001", # ambiguous unicode in strings
  "RUF002",
  "RUF003",
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["conversat"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["src/conversat"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["conversat"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
